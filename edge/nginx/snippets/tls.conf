# TLS del borde (Fase 3). Certificado wildcard *.sig.systems, gestión MANUAL:
# los archivos viven en edge/certs/ (fuera de git) y se recargan con `make reload`.
#   sig.systems.crt  certificado + cadena intermedia (fullchain), PEM
#   sig.systems.key  clave privada, PEM
ssl_certificate     /etc/nginx/certs/sig.systems.crt;
ssl_certificate_key /etc/nginx/certs/sig.systems.key;

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SIGEDGE:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# El 8091 ahora es solo HTTPS. Un cliente que hable HTTP plano a este puerto recibe
# el código interno 497; se le redirige a https en el mismo host:puerto. 308 conserva
# el método y el cuerpo (un POST sigue siendo POST), pero los clientes que no siguen
# redirecciones deben cambiar su URL a https://.
error_page 497 =308 https://$http_host$request_uri;
