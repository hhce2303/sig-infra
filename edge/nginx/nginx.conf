# nginx.conf global del borde SIG. Los vhosts viven en conf.d/ (uno por consumidor).
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato con host y tiempos de upstream para diagnosticar por consumidor.
    log_format edge '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log edge;

    sendfile on;
    server_tokens off;

    # Salud del propio borde: listener interno, NO publicado (healthcheck y smoke test).
    server {
        listen 127.0.0.1:8081;
        location = /healthz { access_log off; return 200 "ok\n"; }
    }

    include /etc/nginx/conf.d/*.conf;
}
