# Vhost de SLC-SIG_platform (dueño: equipo SLC). Copiado de
# SLC-SIG_platform/docker/nginx.conf/default.conf; único cambio: el upstream es el
# alias `slc-web` en la red sig-edge (el web de SLC debe unirse a ella; ver docs/runbook.md).
# Sigue siendo default_server: hoy SLC también se consume por IP (192.168.1.69:8091).

server {
    listen 443 ssl default_server;
    http2 on;
    include snippets/tls.conf;
    server_name api.sig.systems _;

    # Upstream resuelto por petición: el borde arranca aunque SLC esté caído (502 solo aquí).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream http://slc-web:8000;

    client_max_body_size 50M;  # uploads de planos indoor (SiteIndoorMapUploadSerializer)

    # Media — archivos subidos (planos indoor), desde el volumen de SLC
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API — incluye SSE/streaming sin buffering
    location /api/ {
        proxy_pass         $django_upstream;
        include            snippets/proxy-headers.conf;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400;
    }

    # Auth
    location /web-auth/ {
        proxy_pass         $django_upstream;
        include            snippets/proxy-headers.conf;
    }
}
