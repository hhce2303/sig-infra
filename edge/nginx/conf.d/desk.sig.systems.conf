# Vhost de SIG-Desk (dueño: equipo SIG-Desk). Copiado sin cambios de
# SLC-SIG_platform/docker/nginx.conf/conf.d/desk.conf.
#   desk.sig.systems/desk-api/*  → sigdesk-kong:8000 (sin el prefijo)

server {
    listen 443 ssl;
    http2 on;
    include snippets/tls.conf;
    server_name desk.sig.systems;

    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Kong expone rutas sin prefijo (/tickets, /me, ...) → se retira /desk-api/.
    location /desk-api/ {
        set $desk_kong http://sigdesk-kong:8000;
        rewrite            ^/desk-api/(.*)$ /$1 break;
        proxy_pass         $desk_kong;
        include            snippets/proxy-headers.conf;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400;
    }

    location / {
        return 404;
    }
}
