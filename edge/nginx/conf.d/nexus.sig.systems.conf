# Vhost del frontend de SIG-Desk (dueño: equipo SIG-Desk).
#   nexus.sig.systems/desk-api/*  → sigdesk-kong:8000 (sin el prefijo)
#   nexus.sig.systems/            → página temporal hasta que se despliegue el frontend
# La API cuelga del MISMO origen que el frontend: el navegador no hace CORS.
# Cuando exista el frontend, `location /` pasa a servirlo (estático o sigdesk-frontend).

server {
    listen 443 ssl;
    http2 on;
    server_name nexus.sig.systems;
    include snippets/tls.conf;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location /desk-api/ {
        set $desk_kong http://sigdesk-kong:8000;
        rewrite            ^/desk-api/(.*)$ /$1 break;
        proxy_pass         $desk_kong;
        include            snippets/proxy-headers.conf;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400;
    }

    location / {
        root  /srv/sites/nexus;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
